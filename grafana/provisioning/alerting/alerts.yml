# 2026-08-30 (platform#2516, Owner-Go 222): die vier hier provisionierten Regeln
# (alert-cpu-high, alert-ram-critical, alert-disk-high, alert-db-connections)
# sendeten jede Minute an `grafana-default-email` — ohne SMTP, also ins Leere.
# Odoo ist stillgelegt, die Regeln zielten auf Odoo. Flotten-Alerts leben jetzt
# in Prometheus (grafana/prometheus/rules/flotte.yml); ihr Weg zum Menschen ist
# platform infra/alarmwege.yaml (Discord-Secret offen). Ein Alert ohne Kanal
# ist keiner — deshalb hier Loeschung statt Stummschaltung.
apiVersion: 1
deleteRules:
  - orgId: 1
    uid: alert-cpu-high
  - orgId: 1
    uid: alert-ram-critical
  - orgId: 1
    uid: alert-disk-high
  - orgId: 1
    uid: alert-db-connections

# Alert-Regeln fuer die Flotte (KONZ-platform-054, 2026-08-30).
# Schwellen sind aus dem Lauf vom 2026-08-30 hergeleitet, nicht geraten:
#   * Swap prod stand seit 2026-08-24 taeglich bei 88-100 % (sar) -> 90 % / 30 min
#   * risk_hub_celery_beat stand bei 98,4 % seines Limits, 2x OOM  -> 90 % / 15 min
#   * travel_beat_celery_beat: 5-13 Neustarts je 6 h                 -> >3 in 1 h
#   * Platte prod 67 %, Vorlauf via predict_linear ueber 7 Tage       -> voll in <14 d
groups:
  - name: flotte
    rules:
      - alert: HostSwapHigh
        expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) > 0.9
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: Swap zu {{ $value | humanizePercentage }} belegt"

      - alert: HostDiskFullSoon
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}[7d], 14*24*3600) < 0
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: / ist nach 7-Tage-Trend in < 14 Tagen voll"

      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.host }}: / unter 10 % frei"

      - alert: ContainerNearMemoryLimit
        expr: container_memory_working_set_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} > 0.9 and container_spec_memory_limit_bytes{name!=""} > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.name }}: > 90 % des Speicherlimits"

      - alert: ContainerRestartLoop
        expr: increase(container_restart_count{name!=""}[1h]) > 3
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.name }}: {{ $value }} Neustarts in 1 h"

      - alert: FleetTargetDown
        expr: up{job=~"fleet-.*"} == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Exporter {{ $labels.host }} ({{ $labels.job }}) antwortet nicht"
